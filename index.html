<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Mis Hábitos</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="header-row">
    <h1>📊 Mis Hábitos</h1>
    <button class="btn-export" id="exportBtn" type="button">Exportar backup</button>
  </div>

  <div id="storageWarning" class="empty-state" hidden></div>

  <div class="tabs" id="tabs">
    <button class="tab active">Hoy</button>
    <button class="tab">Calendario</button>
    <button class="tab">Estadísticas</button>
  </div>

  <div id="todayView" class="view active"></div>

  <div id="calendarView" class="view">
    <div class="habit-selector">
      <select id="calendarHabitSelect"></select>
    </div>
    <div class="calendar">
      <div class="calendar-header">
        <button class="calendar-nav" id="prevMonth">◀</button>
        <span class="calendar-month" id="currentMonth"></span>
        <button class="calendar-nav" id="nextMonth">▶</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <div id="statsView" class="view"></div>

  <button class="add-btn" id="addBtn">+</button>

  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">Nuevo Hábito</div>

      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="habitName" placeholder="Ej: Meditar" />
      </div>

      <div class="form-group">
        <label>Icono</label>
        <div class="icon-grid" id="iconGrid"></div>
      </div>

      <div class="form-group">
        <label>Color</label>
        <div class="color-grid" id="colorGrid"></div>
      </div>

      <div class="form-group">
        <label>Frecuencia</label>
        <div class="freq-options" id="freqOptions"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" id="cancelBtn">Cancelar</button>
        <button class="btn-primary" id="saveBtn">Guardar</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>

</html>
